/* iBUILD Guidelines 2026 · paleta de comunicação interna: Preto #000, Azure #2A646B, Grafite #333, Cinza Médio #B2B2B2, Off White #F1F1F1.
   Layout: barra preta fixa com logo + menu (fundo principal da marca); coluna de trabalho de até 1080px; linhas que empilham no celular */
:root{
  --bg:#F1F1F1; --surface:#FFFFFF; --sunk:#E8E8E8; --ink:#1A1A1A; --muted:#5E5E5E; --line:#D9D9D9;
  --accent:#2A646B; --accent-ink:#FFFFFF; --accent-soft:#DDEAEB;
  --ok:#2E7550; --ok-soft:#DFEDE5; --bad:#B03A32; --bad-soft:#F6E0DD; --warn:#806419; --warn-soft:#F4ECD3;
  --c1:#2A646B; --c2:#B79A4C; --c3:#333333; --c4:#7FAEB3; --c5:#8C8C8C; --c6:#DCC580; --c7:#16393D; --c8:#C9C9C9;
  --bar:#000000; --bar-fg:#F1F1F1; --bar-accent:#7FB3B9; --azure:#2A646B; --gold:#DCC580;
  --display:"Montserrat","Segoe UI",system-ui,sans-serif;
  --body:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --mono:"Segoe UI",system-ui,-apple-system,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111111; --surface:#1C1C1C; --sunk:#262626; --ink:#F1F1F1; --muted:#B2B2B2; --line:#333333;
  --accent:#6FA8AE; --accent-ink:#0B1B1D; --accent-soft:#1B3033;
  --ok:#6DBF91; --ok-soft:#1A3025; --bad:#E87A70; --bad-soft:#3A201D; --warn:#DCC580; --warn-soft:#332C17;
  --c1:#4E8F96; --c2:#DCC580; --c3:#8C8C8C; --c4:#9CCBD0; --c5:#F1F1F1; --c6:#A6873B; --c7:#2A646B; --c8:#5C5C5C;

:root[data-theme="dark"]{
  --bg:#111111; --surface:#1C1C1C; --sunk:#262626; --ink:#F1F1F1; --muted:#B2B2B2; --line:#333333;

*{box-sizing:border-box}
/* base (substitui o esqueleto que o Claude fornecia) */
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;-webkit-text-size-adjust:100%}
img{max-width:100%}
[hidden]{display:none!important}

a{color:var(--accent);text-underline-offset:2px}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar)}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bar);color:var(--bar-fg);border-bottom:1px solid #262626}

<script>
const DEFAULT_FUNCOES=["Encarregado","PCP","Engenheiro","Montador Steel Frame","Montador Drywall","Eletricista","Encanador","Pedreiro","Ajudante","Meio-Oficial Montagem LSF","Carpinteiro","Armador"];
const VINC={CLT:"Próprio",TER:"Terceirizado",DIA:"Diarista/autônomo"};
const NAV={presenca:"Presença",painel:"Painel",consolidado:"Consolidado",colaboradores:"Colaboradores",empresas:"Empresas",obras:"Obras",relatorios:"Relatórios",acessos:"Acessos",config:"Configurações"};
const VIEWS=Object.keys(NAV);
const CAD=["colaboradores","empresas","obras"];
const ORDER=["presenca","painel","consolidado","CAD","relatorios","acessos","config"];

const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>iso(new Date());
const parseD=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parseD(s);d.setDate(d.getDate()+n);return iso(d)};
const fmtD=s=>parseD(s).toLocaleDateString("pt-BR",{weekday:"short",day:"2-digit",month:"2-digit"});
const fmtShort=s=>parseD(s).toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"});
const cmp=(a,b)=>String(a).localeCompare(String(b),"pt-BR");
const byNome=(a,b)=>cmp(a.nome,b.nome);
const WINDOW_START=addDays(today(),-120);

const S={db:null,sb:null,session:null,uid:null,dl:null,canWrite:true,cfgErr:"",setup:false,authBusy:false,unsubs:[],
  obras:[],empresas:[],colabs:[],pres:new Map(),extra:new Map(),
  got:{obras:false,empresas:false,colabs:false,pres:false},slow:false,error:"",noDb:false,
  view:"presenca",sel:{obra:"",data:today()},drafts:{},saving:false,painelData:today(),
  rep:{obra:"all",dias:30,por:"funcao",ini:"",fim:""},cons:{dias:15,col:"obra",fn:"",ini:"",fim:""},hist:new Map(),histFrom:null,histBusy:false,teamF:"",
  loginErr:"",pwMode:"",cf:{q:"",obra:"",emp:""},selC:new Set(),
  editColab:null,editObra:null,editEmp:null,confirm:"",showImport:false,importText:"",importObra:"",names:{},
  perfis:[],funcoesCfg:null,cfgNova:"",cfgConfirm:"",userDone:false,perfisSeen:false,editUser:null,me:null};
let CFG={};

/* ---------- perfis ---------- */
function role(){
  if(S.sim)return "ENC";
  if(!S.userDone||!S.perfisSeen)return "LOAD";
  if(!S.uid)return "ANON";
  const p=S.perfis.find(p=>p.id===S.uid);return p?p.papel:"PEND";
}
const ADMIN=new Set(["RH","ENG"]);
const isRH=()=>ADMIN.has(role());
const allowedViews=()=>isRH()?VIEWS:role()==="ENC"?["presenca","relatorios"]:[];
function myObraIds(){if(S.sim)return S.sim.obras;const p=S.perfis.find(p=>p.id===S.uid);return p?.obras||[]}
const realAdmin=()=>!S.sim&&isRH();
function repObras(){if(isRH())return S.obras;const ids=myObraIds();return S.obras.filter(o=>ids.includes(o.id))}
function minhasObras(){
  const ativas=S.obras.filter(o=>o.ativa!==false);
  if(isRH())return ativas;
  const ids=myObraIds();return ativas.filter(o=>ids.includes(o.id));
}

/* ---------- helpers ---------- */
const obraById=id=>S.obras.find(o=>o.id===id);
const empById=id=>S.empresas.find(e=>e.id===id);
const empNome=c=>empById(c?.empresaId)?.nome||"Sem empresa";
const funcoes=()=>S.funcoesCfg||DEFAULT_FUNCOES;
const pkey=(o,d)=>`${o}_${d}`;
function getPres(key){
  if(S.pres.has(key))return S.pres.get(key);
  if(S.extra.has(key))return S.extra.get(key);
  const data=key.slice(-10);
  if(data<WINDOW_START&&S.db){S.extra.set(key,undefined);S.db.doc("presencas/"+key).get().then(s=>{S.extra.set(key,s.exists?s.data():null);render()}).catch(()=>{})}
  return null;
}

function errMsg(e){

function periodDays(o){
  let a,b;
  if(o.dias==="custom"){a=o.ini||addDays(today(),-29);b=o.fim||today();if(a>b)[a,b]=[b,a];if(b>today())b=today();if(a>b)a=b}
  else{b=today();a=addDays(b,-(o.dias-1))}
  const days=[];for(let d=a;d<=b&&days.length<732;d=addDays(d,1))days.push(d);
  return days;
}

function ensureHist(from){
  if(!S.db||from>=WINDOW_START||S.histBusy||(S.histFrom&&S.histFrom<=from))return;
  S.histBusy=true;
  S.db.collection("presencas").where("data",">=",from).where("data","<",WINDOW_START).get()
    .then(q=>{q.docs.forEach(d=>S.hist.set(d.id,d.data()));S.histFrom=from})

async function apiUsuarios(acao,body){
  const {data}=await S.sb.auth.getSession();const tok=data&&data.session&&data.session.access_token;
  const r=await fetch("/api/usuarios",{method:"POST",headers:{"Content-Type":"application/json",...(tok?{Authorization:"Bearer "+tok}:{})},body:JSON.stringify({acao,...body})});
  let j={};try{j=await r.json()}catch{}
  if(!r.ok)throw {apiMsg:j.erro||"Não foi possível concluir. Tente de novo."};

document.addEventListener("submit",async ev=>{
  const f=ev.target;if(!["login-form","setup-form","pw-form"].includes(f.id))return;ev.preventDefault();

      const nome=V.nome.trim(),u=normUser(V.su),a=V.a,b=V.b;
      if(a!==b)S.loginErr="As duas senhas não são iguais.";

        const {error}=await S.sb.auth.signInWithPassword({email:toEmail(u),password:a});if(error)S.loginErr=error.message}

});

/* ---------- presença ---------- *//* ---------- presença ---------- */
function rowsFor(obraId,key){
  const saved=getPres(key)||null,d=S.drafts[key],regs=(saved&&saved.registros)||[];
  const st=d?d.st:Object.fromEntries(regs.map(r=>[r.c,r.s]));
  const ids=new Set(S.colabs.filter(c=>c.obraId===obraId&&c.ativo!==false).map(c=>c.id));
  regs.forEach(r=>ids.add(r.c));if(d){Object.keys(d.st).forEach(i=>ids.add(i));Object.keys(d.rm).forEach(i=>ids.delete(i))}
  const cm=new Map(S.colabs.map(c=>[c.id,c])),old=new Map(regs.map(r=>[r.c,r]));
  return [...ids].map(id=>{const c=cm.get(id),o=old.get(id)||{};return{id,nome:c?.nome||o.n||"(removido)",funcao:c?.funcao||o.f||"Sem função",vinc:c?.vinculo||o.v||"CLT",empresaId:c?c.empresaId||"":o.e||"",empresa:c?empNome(c):(o.en||"Sem empresa"),alocado:c?.obraId===obraId,s:st[id]||""}})
    .sort((a,b)=>cmp(a.funcao,b.funcao)||cmp(a.nome,b.nome));
}

  </div>`;
  if(!rows.length)h+=`<div class="panel empty"><h3>Nenhum colaborador nesta obra</h3><p class="muted">${rh?`Aloque colaboradores em <a href="#colaboradores">Colaboradores</a> ou inclua alguém de outra obra no campo acima.`:"O RH ainda não alocou colaboradores nesta obra."}</p></div>`;
  else{

  return h;
}
function ensureDraft(key){

async function savePres(){
  if(S.sim){toast("Simulação: a presença não foi salva.");return}

  const rows=rowsFor(obraId,key).filter(r=>r.s);

  const body={obraId,obraNome:obraById(obraId)?.nome||"",data,registros,total:pres.length,
    ausentes:registros.filter(r=>r.s==="A").length,
    porFuncao:count("f"),porEmpresa:count("en"),porVinculo:count("v"),
    atualizadoPor:S.uid||null,atualizadoEm:new Date().toISOString()};

}

function barList(obj,max){
  const ent=Object.entries(obj).sort((a,b)=>b[1]-a[1]||cmp(a[0],b[0]));const top=Math.max(1,...ent.map(e=>e[1]));
  const shown=ent.slice(0,max),rest=ent.slice(max).reduce((s,e)=>s+e[1],0);
  if(rest)shown.push(["Outros",rest]);
  if(!shown.length)return `<p class="small muted">Sem registros.</p>`;
  return `<div class="bars">${shown.map(([k,v])=>`<div class="bar"><div class="lbl"><i style="width:${Math.round(v/top*100)}%"></i><span>${esc(k)}</span></div><b>${v}</b></div>`).join("")}</div>`;
}

async function runImport(){
  const lines=parseImport(S.importText);if(!lines.length)return;
  const empMap=new Map(S.empresas.map(e=>[e.nome.trim().toLowerCase(),e.id]));let ok=0;
  const lista=[...funcoes()],low=new Set(lista.map(f=>f.toLowerCase()));
  lines.forEach(l=>{if(!l.funcao)return;const m=lista.find(f=>f.toLowerCase()===l.funcao.toLowerCase());if(m)l.funcao=m;else if(!low.has(l.funcao.toLowerCase())){lista.push(l.funcao);low.add(l.funcao.toLowerCase())}});
  if(lista.length!==funcoes().length){try{await saveFuncoes(lista)}catch(e){toast(errMsg(e),true);return}}

    for(const l of lines){
      let eid="";const en=l.empresa.trim();

      const now=new Date().toISOString();

    }
    toast(`${ok} colaboradores importados`);S.importText="";S.showImport=false;render();

}

const POR={funcao:["porFuncao","Função"],empresa:["porEmpresa","Empresa"],vinculo:["porVinculo","Vínculo"]};
function repData(){
  const days=periodDays(S.rep);
  const field=POR[S.rep.por][0],lab=k=>S.rep.por==="vinculo"?(VINC[k]||k):k;
  const ok=new Set(repObras().map(o=>o.id));
  const docs=allPres(days).filter(p=>ok.has(p.obraId)&&(S.rep.obra==="all"||p.obraId===S.rep.obra));
  const per=days.map(d=>({d,g:{},tot:0,has:false}));const idx=new Map(days.map((d,i)=>[d,i]));const rows=[];
  docs.forEach(p=>{const i=idx.get(p.data);if(i===undefined)return;const r=per[i];r.has=true;r.tot+=p.total||0;
    Object.entries(p[field]||{}).forEach(([k,v])=>{const K=lab(k);r.g[K]=(r.g[K]||0)+v;rows.push([p.data,p.obraNome||obraById(p.obraId)?.nome||"",POR[S.rep.por][1],K,v])})});
  const totals={};per.forEach(r=>Object.entries(r.g).forEach(([k,v])=>totals[k]=(totals[k]||0)+v));
  let keys=Object.keys(totals).sort((a,b)=>totals[b]-totals[a]);
  if(keys.length>8){const keep=keys.slice(0,7);per.forEach(r=>{let o=0;Object.keys(r.g).forEach(k=>{if(!keep.includes(k)){o+=r.g[k];delete r.g[k]}});if(o)r.g["Outros"]=o});keys=[...keep,"Outros"]}
  return{per,keys,totals,rows,days};
}
function niceMax(v){if(v<=5)return 5;const p=Math.pow(10,Math.floor(Math.log10(v)));const n=v/p;return (n<=1?1:n<=2?2:n<=5?5:10)*p}
function chartSVG(per,keys){
  const W=760,H=280,L=36,R=8,T=12,B=34,iw=W-L-R,ih=H-T-B;
  const top=Math.max(1,...per.map(r=>r.tot)),step=Math.max(1,niceMax(top/4)>top/4*2.5?Math.ceil(top/4):niceMax(top/4)),nT=Math.max(1,Math.ceil(top/step)),mx=step*nT;const bw=iw/per.length,gap=Math.min(4,bw*.25);
  const col=k=>`var(--c${keys.indexOf(k)+1})`;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Histograma do efetivo diário">`;
  for(let i=0;i<=nT;i++){const v=step*i,y=T+ih-ih*i/nT;s+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y+3}" text-anchor="end">${Math.round(v)}</text>`}
  const every=Math.ceil(per.length/12);
  per.forEach((r,i)=>{const x=L+i*bw+gap/2,w=Math.max(1,bw-gap);let y=T+ih;
    if(!r.has)s+=`<rect x="${x}" y="${T+ih-3}" width="${w}" height="3" fill="var(--line)"><title>${fmtD(r.d)}: sem lançamento</title></rect>`;
    keys.forEach(k=>{const v=r.g[k]||0;if(!v)return;const hgt=ih*v/mx;y-=hgt;s+=`<rect x="${x}" y="${y}" width="${w}" height="${hgt}" fill="${col(k)}"><title>${fmtD(r.d)} · ${esc(k)}: ${v}</title></rect>`});
    if(i%every===0||i===per.length-1)s+=`<text x="${x+w/2}" y="${H-B+16}" text-anchor="middle">${fmtShort(r.d)}</text>`});
  return s+`</svg>`;
}

/* ---------- consolidado ---------- */
function consData(){
  const ativas=S.obras.filter(o=>o.ativa!==false),ids=new Set(ativas.map(o=>o.id)),fn=S.cons.fn,isObra=S.cons.col==="obra";
  const days=periodDays(S.cons);
  const byDay=new Map(days.map(d=>[d,{d,g:{},tot:0,has:false,lanc:0}]));
  allPres(days).forEach(p=>{if(!ids.has(p.obraId))return;const r=byDay.get(p.data);if(!r)return;
    const regs=(p.registros||[]).filter(x=>x.s==="P"&&(!fn||x.f===fn));
    r.has=true;r.lanc++;r.tot+=regs.length;
    if(isObra){const k=obraById(p.obraId).nome;r.g[k]=(r.g[k]||0)+regs.length}
    else regs.forEach(x=>{const k=x.en||"Sem empresa";r.g[k]=(r.g[k]||0)+1})});
  const per=[...byDay.values()];const tot={};per.forEach(r=>Object.entries(r.g).forEach(([k,v])=>tot[k]=(tot[k]||0)+v));
  const cols=isObra?ativas.map(o=>o.nome):Object.keys(tot).filter(k=>tot[k]).sort((a,b)=>tot[b]-tot[a]);
  return{per,cols,ativas,tot,days};
}
function funcOpts(){const set=new Set(funcoes());[...S.pres.values()].forEach(p=>(p.registros||[]).forEach(r=>r.f&&set.add(r.f)));return [...set]}
function limitKeys(per,cols){
  if(cols.length<=8)return{per,keys:cols};
  const keep=cols.slice(0,7);

}

  if(grp==="colab")S.editColab[f]=val;

  else if(grp==="user"){S.editUser[f]=val;if(f==="papel")render()}
  else if(grp==="emp")S.editEmp[f]=val;
  else if(grp==="obra")S.editObra[f]=val;

  else if(grp==="imp"){if(f==="text")S.importText=val;else S.importObra=val;if(ev.type==="change"||f==="text")render()}
  else if(grp==="cons"||grp==="rep"){const o=S[grp];

    else if(f==="ini"||f==="fim"){if(!val||ev.type==="input")return;o[f]=val}
    else o[f]=val;
    render()}
  else if(grp==="team"){S.teamF=val;render()}
}

/* ---------- conexão com o Supabase ---------- */
function makeDb(sb){
  const COLS={presencas:{data:"data",obraId:"obra_id"}};
  const mapErr=e=>{const m=(e&&e.message)||"",c=e&&e.code;
    if(c==="42501"||/row-level security|permission denied/i.test(m))return{code:"invalid_argument",message:m};
    if(c==="PGRST301"||/jwt/i.test(m))return{code:"revoked",message:m};
    return{code:"unavailable",message:m}};
  const meta={fromCache:false,hasPendingWrites:false};
  const snapDoc=(id,row)=>({id,exists:!!row,data:()=>row?row.doc:undefined,metadata:meta});
  const qsnap=rows=>{const docs=rows.map(r=>snapDoc(String(r.id),r));return{docs,size:docs.length,empty:!docs.length,metadata:meta,docChanges:()=>[]}};
  let n=0;
  function live(table,filter,fetcher,next,error){
    let dead=false,t=null;
    const run=()=>{if(dead)return;fetcher().then(v=>{if(!dead)next(v)},e=>{if(!dead&&error)error(e&&e.code?e:mapErr(e))})};
    const kick=()=>{clearTimeout(t);t=setTimeout(run,250)};
    const ch=sb.channel("rt-"+table+"-"+(++n)).on("postgres_changes",{event:"*",schema:"public",table,...(filter?{filter}:{})},kick).subscribe();
    const vis=()=>{if(document.visibilityState==="visible")kick()};
    document.addEventListener("visibilitychange",vis);
    const iv=setInterval(kick,60000);
    run();
    return()=>{dead=true;clearTimeout(t);clearInterval(iv);document.removeEventListener("visibilitychange",vis);sb.removeChannel(ch)};
  }
  function doc(path){
    const [table,id]=path.split("/");
    const get=async()=>{const {data,error}=await sb.from(table).select("id,doc").eq("id",id).maybeSingle();if(error)throw mapErr(error);return snapDoc(id,data)};
    return{id,path,get,
      async set(d){const {error}=await sb.from(table).upsert({id,doc:d});if(error)throw mapErr(error)},
      async update(d){const cur=await get();if(!cur.exists)throw{code:"invalid_argument",message:"Registro não encontrado"};const {error}=await sb.from(table).update({doc:{...cur.data(),...d}}).eq("id",id);if(error)throw mapErr(error)},
      async delete(){const {error}=await sb.from(table).delete().eq("id",id);if(error)throw mapErr(error)},
      onSnapshot(next,error){return live(table,"id=eq."+id,get,next,error)}};
  }
  function query(table,filters){
    const fetchAll=async()=>{const out=[];
      for(let from=0;;from+=1000){
        let q=sb.from(table).select("id,doc").order("id").range(from,from+999);
        for(const [f,op,v] of filters){const c=(COLS[table]||{})[f];if(!c)throw{code:"invalid_argument",message:"Filtro não suportado: "+f};
          q=op==="=="?q.eq(c,v):op===">="?q.gte(c,v):op===">"?q.gt(c,v):op==="<="?q.lte(c,v):op==="<"?q.lt(c,v):q}
        const {data,error}=await q;if(error)throw mapErr(error);out.push(...data);if(data.length<1000)break}
      return qsnap(out)};
    return{path:table,where:(f,op,v)=>query(table,[...filters,[f,op,v]]),get:fetchAll,
      onSnapshot:(next,error)=>live(table,null,fetchAll,next,error),
      doc:id=>doc(table+"/"+id),
      async add(d){const {data,error}=await sb.from(table).insert({doc:d}).select("id").single();if(error)throw mapErr(error);return doc(table+"/"+data.id)}};
  }
  return{doc,collection:t=>query(t,[])};
}
function saveFile({filename,data}){
  const blob=new Blob([data],{type:"text/csv;charset=utf-8"}),a=document.createElement("a");
  a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);return Promise.resolve({status:"saved"});
}

function stopData(){S.unsubs.forEach(u=>{try{u()}catch{}});S.unsubs=[]}
function resetData(){
  Object.assign(S,{obras:[],empresas:[],colabs:[],pres:new Map(),extra:new Map(),hist:new Map(),histFrom:null,perfis:[],funcoesCfg:null,
    got:{obras:false,empresas:false,colabs:false,pres:false},perfisSeen:false,drafts:{},editColab:null,editObra:null,editEmp:null,editUser:null,sim:null,error:"",slow:false,me:null});
}
function startData(){
  const db=makeDb(S.sb);S.db=db;
  const timer=setTimeout(()=>{S.slow=true;render()},10000);
  const fail=e=>{clearTimeout(timer);S.error=e&&e.code==="revoked"?"Sua sessão expirou. Saia e entre de novo.":"Não foi possível carregar os dados agora. Verifique a conexão; a página continua tentando.";render()};
  const ok=()=>{if(S.error){S.error=""}};
  const mark=(k,s)=>{ok();if(!s.metadata.fromCache)S.got[k]=true;if(allGot()){clearTimeout(timer);S.slow=false}};
  S.unsubs.push(
    db.collection("perfis").onSnapshot(s=>{ok();S.perfis=s.docs.map(d=>({id:d.id,...d.data()}));S.perfisSeen=true;const me=myPerfil();S.me=me?{name:me.nome||me.usuario,email:me.usuario}:{name:"",email:""};render()},fail),
    db.collection("obras").onSnapshot(s=>{S.obras=s.docs.map(d=>({id:d.id,...d.data()})).sort(byNome);mark("obras",s);render()},fail),
    db.collection("empresas").onSnapshot(s=>{S.empresas=s.docs.map(d=>({id:d.id,...d.data()})).sort(byNome);mark("empresas",s);render()},fail),
    db.collection("colaboradores").onSnapshot(s=>{S.colabs=s.docs.map(d=>({id:d.id,...d.data()}));mark("colabs",s);render()},fail),
    db.doc("config/funcoes").onSnapshot(s=>{ok();const l=s.exists&&s.data().lista;S.funcoesCfg=Array.isArray(l)&&l.length?l:null;render()},fail),
    db.collection("presencas").where("data",">=",WINDOW_START).onSnapshot(s=>{S.pres=new Map(s.docs.map(d=>[d.id,d.data()]));mark("pres",s);render()},fail),
    ()=>clearTimeout(timer));
}
function onSession(session){
  const uid=session&&session.user?session.user.id:null;
  S.session=session;
  if(uid===S.uid&&S.userDone)return;
  stopData();resetData();S.uid=uid;S.userDone=true;S.pwMode="";S.userOpen=false;S.cadOpen=false;
  if(uid)startData();
  render();
}
async function boot(){
  document.getElementById("nav").addEventListener("scroll",closeCad,{passive:true});window.addEventListener("resize",closeCad);
  document.getElementById("hoje").textContent=new Date().toLocaleDateString("pt-BR",{weekday:"long",day:"2-digit",month:"long"});
  route();window.addEventListener("hashchange",route);
  S.dl={save:saveFile};
  try{const r=await fetch("/api/config",{cache:"no-store"});const j=await r.json().catch(()=>({}));if(!r.ok||!j.url||!j.anonKey)throw new Error(j.erro||"Não foi possível ler a configuração do servidor.");CFG=j}
  catch(e){S.cfgErr=e.message||String(e);render();return}
  if(!window.supabase||!window.supabase.createClient){S.cfgErr="Não foi possível carregar a biblioteca do Supabase. Verifique a conexão com a internet.";render();return}
  S.sb=window.supabase.createClient(CFG.url,CFG.anonKey,{auth:{persistSession:true,autoRefreshToken:true,storageKey:"efetivo-ibuild-auth"}});
  try{const {data}=await S.sb.rpc("precisa_configurar");S.setup=data===true}catch{}
  const {data}=await S.sb.auth.getSession();
  onSession(data.session);
  S.sb.auth.onAuthStateChange((ev,session)=>onSession(session));
}
boot();
</script>
